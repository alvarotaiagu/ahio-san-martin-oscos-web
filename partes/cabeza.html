<!-- script bloqueante: clases antes del primer pintado y el puente con la cortina (módulo Entrada: js/linterna.js) -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') { h.classList.add('densidad-sobria'); h.setAttribute('data-densidad', 'sobria'); }
    }
  } catch (e) {}
  // El puente con la cortina: existe desde el primer momento, cargue antes quien cargue.
  // La cortina (Entrada) llama a Ahio.abrir() cuando EMPIEZA a abrirse y a Ahio.retirarCortina() al acabar
  // (o lanza ahio:cortina-abre / ahio:cortina-fuera). La web y los módulos usan Ahio.alAbrirse(fn).
  var A = window.Ahio = window.Ahio || {};
  var cola = [];
  var avisar = function (n) { try { d.dispatchEvent(new CustomEvent(n)); } catch (e) {} };
  A.alAbrirse = function (fn) { if (A.abierta) { try { fn(); } catch (e) { console.warn(e); } } else cola.push(fn); };
  A.abrir = function () {
    if (A.abierta) return;
    A.abierta = true;
    cola.splice(0).forEach(function (fn) { try { fn(); } catch (e) { console.warn(e); } });
    avisar('ahio:abierta');
  };
  A.retirarCortina = function () {
    if (A.cortinaFuera) return;
    A.cortinaFuera = true;
    clearTimeout(window.__redCortina);
    try { if (A.cortina && !A.cortina.fuera && A.cortina.retirar) A.cortina.retirar(); } catch (e) {}
    h.classList.remove('cortina-activa');
    h.classList.add('cortina-fuera');
    A.abrir();
    avisar('ahio:fuera');
  };
  d.addEventListener('ahio:cortina-abre', function () { A.abrir(); });
  d.addEventListener('ahio:cortina-fuera', function () { A.retirarCortina(); });
  // red de seguridad por si main.js o la cortina no llegan: la cortina se va sola
  // (si la cortina sigue en marcha, Ahio.cortina.enMarcha, se le deja acabar: espera hasta 12 s)
  var red = function (t) { window.__redCortina = setTimeout(function () { if (A.cortina && A.cortina.enMarcha && !A.cortina.fuera && t < 12000) red(t + 1000); else A.retirarCortina(); }, t ? 1000 : 6500); };
  red(0);
})(document);
</script>
